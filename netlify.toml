# Netlify config for Realm AI.
#
# The repo is Cloudflare-first (Workers + static assets, or Pages Functions); this file exists
# because this repository is also connected to a Netlify site, and it used to publish the repo
# ROOT — where the site file was once named "index (2).html", so / 404'd.
#
# This file wins over the dashboard's build settings, so the publish directory can never drift:
# the site lives in public/, and /api/* is served by netlify/functions/api.mjs.

[build]
  command = "npm run check"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Netlify kills functions at 26s no matter what; the agent runner therefore does
  # ONE model call per request (plan / step / verify) instead of one long request.
  # AI answers still need headroom, so the wrapper caps the provider call a little below this.
  timeout = 26

# One function serves every API route; keep in sync with ROUTES in shared/api.js.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
  headers = { cache-control = "no-store" }

# Pretty URLs for the two standalone pages.
[[redirects]]
  from = "/welcome"
  to = "/welcome.html"
  status = 301
  force = false

[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 200
  force = false

[build.environment]
  NODE_VERSION = "22"

# Never cache the API; keep the 1-hour default for the rest.
[[headers]]
  for = "/api/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
